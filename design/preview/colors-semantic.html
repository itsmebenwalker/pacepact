<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head><body>
<p class="eyebrow">Semantic tokens — light / dark pair</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div>
    <p style="margin:0 0 8px;font-size:11px;color:#71717a">Light</p>
    <div style="background:#fafafa;border:1px solid #e4e4e7;border-radius:8px;padding:14px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span style="background:#fff;border:1px solid #e4e4e7;border-radius:4px;padding:4px 8px;font-size:11px">surface</span>
        <span style="background:#f4f4f5;border-radius:4px;padding:4px 8px;font-size:11px">surface-2</span>
        <span style="background:#fff;border:1px solid #e4e4e7;border-radius:4px;padding:4px 8px;font-size:11px;color:#18181b">fg</span>
        <span style="background:#fff;border:1px solid #e4e4e7;border-radius:4px;padding:4px 8px;font-size:11px;color:#71717a">fg-muted</span>
        <span style="background:#fff;border:1px solid #e4e4e7;border-radius:4px;padding:4px 8px;font-size:11px;color:#a1a1aa">fg-subtle</span>
        <span style="background:#18181b;color:#fff;border-radius:4px;padding:4px 8px;font-size:11px">btn-primary</span>
      </div>
    </div>
  </div>
  <div>
    <p style="margin:0 0 8px;font-size:11px;color:#71717a">Dark</p>
    <div style="background:#09090b;border:1px solid #27272a;border-radius:8px;padding:14px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span style="background:#18181b;border:1px solid #27272a;color:#fafafa;border-radius:4px;padding:4px 8px;font-size:11px">surface</span>
        <span style="background:#27272a;color:#fafafa;border-radius:4px;padding:4px 8px;font-size:11px">surface-2</span>
        <span style="background:#18181b;color:#fafafa;border-radius:4px;padding:4px 8px;font-size:11px;border:1px solid #27272a">fg</span>
        <span style="background:#18181b;color:#a1a1aa;border-radius:4px;padding:4px 8px;font-size:11px;border:1px solid #27272a">fg-muted</span>
        <span style="background:#18181b;color:#71717a;border-radius:4px;padding:4px 8px;font-size:11px;border:1px solid #27272a">fg-subtle</span>
        <span style="background:#fafafa;color:#18181b;border-radius:4px;padding:4px 8px;font-size:11px">btn-primary</span>
      </div>
    </div>
  </div>
</div>
<p class="eyebrow" style="margin-top:14px">Status</p>
<div class="row">
  <div><div class="swatch" style="background:#16a34a">success</div><div class="label mono">#16a34a</div></div>
  <div><div class="swatch" style="background:#fbbf24;color:#27272a">warn</div><div class="label mono">#fbbf24</div></div>
  <div><div class="swatch" style="background:#ef4444">badge</div><div class="label mono">#ef4444</div></div>
  <div><div class="swatch" style="background:#dc2626">danger</div><div class="label mono">#dc2626</div></div>
</div>
</body></html>
