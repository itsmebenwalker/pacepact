<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head><body style="font-family:Inter,sans-serif">
<p class="eyebrow">Cards — group, session, week header</p>
<div style="display:grid;gap:12px;grid-template-columns:1fr 1fr">
  <div style="background:#fff;border:1px solid #e4e4e7;border-radius:8px;padding:16px">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px">
      <div>
        <p style="margin:0;font-size:14px;font-weight:500">Berlin Crew</p>
        <p style="margin:2px 0 0;font-size:13px;color:#71717a">Berlin Marathon 2026</p>
      </div>
      <span style="background:#f4f4f5;color:#52525b;font-size:11px;font-weight:500;padding:3px 8px;border-radius:4px">Marathon</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#a1a1aa">
      <span>45 days to go</span><span>Beat my PB</span>
    </div>
    <div style="border-top:1px solid #f4f4f5;margin-top:14px;padding-top:12px;display:flex;justify-content:space-between">
      <span style="font-size:12px;color:#a1a1aa">Your points</span>
      <span style="font-size:14px;font-weight:600">87</span>
    </div>
  </div>
  <div style="background:#fff;border:1px solid #e4e4e7;border-radius:6px;padding:12px">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:11px;font-weight:500;color:#71717a;text-transform:uppercase;letter-spacing:0.05em">Run</span>
    </div>
    <p style="margin:0;font-size:14px;font-weight:500">Easy 5km recovery run</p>
    <p style="margin:4px 0 0;font-size:12px;color:#a1a1aa">5 km · 30 min</p>
  </div>
</div>
</body></html>
