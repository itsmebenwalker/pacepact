<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head><body style="font-family:Inter,sans-serif">
<p class="eyebrow">Badges & pills</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <span style="background:#f4f4f5;color:#52525b;font-size:11px;font-weight:500;padding:4px 8px;border-radius:4px">Marathon</span>
  <span style="background:#f4f4f5;color:#52525b;font-size:11px;font-weight:500;padding:4px 8px;border-radius:4px">Half Marathon</span>
  <span style="background:#f4f4f5;color:#52525b;font-size:11px;font-weight:500;padding:4px 8px;border-radius:4px">Triathlon</span>
  <span style="display:inline-flex;align-items:center;gap:4px;color:#15803d;font-size:12px;font-weight:500">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    Done
  </span>
  <span style="color:#a1a1aa;font-size:12px;font-weight:500">Ended</span>
</div>
<p class="eyebrow" style="margin-top:14px">Status dots</p>
<div style="display:flex;gap:14px;align-items:center">
  <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px"><span style="width:10px;height:10px;border-radius:9999px;background:#FC5200"></span>Strava connected</span>
  <span style="position:relative;display:inline-flex">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span style="position:absolute;top:-3px;right:-5px;min-width:14px;height:14px;background:#ef4444;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;padding:0 3px">3</span>
  </span>
  <span style="font-size:12px;color:#71717a">Unread bell</span>
</div>
</body></html>
