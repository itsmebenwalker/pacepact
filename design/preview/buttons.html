<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head><body style="font-family:Inter,sans-serif">
<p class="eyebrow">Buttons — primary / secondary / ghost / destructive</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
  <button style="background:#18181b;color:#fff;border:0;font-family:inherit;font-size:14px;font-weight:500;padding:8px 16px;border-radius:6px;cursor:pointer">New group</button>
  <button style="background:#fff;color:#3f3f46;border:1px solid #e4e4e7;font-family:inherit;font-size:14px;font-weight:500;padding:7px 12px;border-radius:6px;cursor:pointer">Back</button>
  <button style="background:transparent;color:#71717a;border:0;font-family:inherit;font-size:14px;padding:6px 12px;border-radius:6px;cursor:pointer">Dashboard</button>
  <button style="background:#dc2626;color:#fff;border:0;font-family:inherit;font-size:14px;font-weight:500;padding:8px 16px;border-radius:6px;cursor:pointer">Delete group</button>
</div>
<p class="eyebrow">Pill — menu trigger</p>
<div style="display:flex;gap:10px;flex-wrap:wrap">
  <button style="background:#fff;color:#3f3f46;border:1px solid #e4e4e7;font-family:inherit;font-size:14px;font-weight:500;padding:6px 12px;border-radius:6px">•••</button>
  <button style="background:#f0fdf4;color:#15803d;border:1px solid #dcfce7;font-family:inherit;font-size:14px;font-weight:500;padding:6px 12px;border-radius:6px">Copied!</button>
</div>
</body></html>
