<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head><body style="font-family:Inter,sans-serif">
<p class="eyebrow">Inputs — text, select, focus</p>
<div style="display:grid;gap:10px;max-width:360px">
  <div>
    <label style="display:block;font-size:13px;font-weight:500;color:#3f3f46;margin-bottom:6px">Email</label>
    <input placeholder="you@example.com" style="width:100%;font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid #d4d4d8;border-radius:6px;background:#fff;color:#18181b;outline:none">
  </div>
  <div>
    <label style="display:block;font-size:13px;font-weight:500;color:#3f3f46;margin-bottom:6px">Event type</label>
    <select style="width:100%;font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid #d4d4d8;border-radius:6px;background:#fff;color:#18181b">
      <option>Marathon</option>
    </select>
  </div>
  <div>
    <label style="display:block;font-size:13px;font-weight:500;color:#3f3f46;margin-bottom:6px">Focused</label>
    <input value="Berlin Marathon 2026" style="width:100%;font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid transparent;border-radius:6px;background:#fff;color:#18181b;outline:none;box-shadow:0 0 0 2px #18181b">
  </div>
</div>
</body></html>
