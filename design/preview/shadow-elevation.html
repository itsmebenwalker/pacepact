<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head><body>
<p class="eyebrow">Elevation — cards & inputs rely on borders, not shadows</p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:8px">
  <div>
    <div style="background:#fff;border:1px solid #e4e4e7;border-radius:8px;padding:16px;height:80px">
      <p style="margin:0;font-size:13px;font-weight:500">Resting card</p>
      <p style="margin:2px 0 0;font-size:11px;color:#71717a">border only</p>
    </div>
    <p class="label mono">0 — resting</p>
  </div>
  <div>
    <div style="background:#fff;border:1px solid #a1a1aa;border-radius:8px;padding:16px;height:80px">
      <p style="margin:0;font-size:13px;font-weight:500">Hover card</p>
      <p style="margin:2px 0 0;font-size:11px;color:#71717a">border → zinc-400</p>
    </div>
    <p class="label mono">0 — hover</p>
  </div>
  <div>
    <div style="background:#fff;border:1px solid #e4e4e7;border-radius:8px;padding:16px;height:80px;box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.10), 0 4px 6px -4px rgb(0 0 0 / 0.08)">
      <p style="margin:0;font-size:13px;font-weight:500">Modal / dropdown</p>
      <p style="margin:2px 0 0;font-size:11px;color:#71717a">shadow-lg, used rarely</p>
    </div>
    <p class="label mono">shadow-lg</p>
  </div>
</div>
</body></html>
