name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --coverage --forceExit
        env:
          # Dummy values satisfy any env-var reads at import time.
          # Tests mock all external services — no real credentials needed.
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          STRAVA_CLIENT_ID: '12345'
          STRAVA_CLIENT_SECRET: test-client-secret
          STRAVA_WEBHOOK_VERIFY_TOKEN: test-verify-token
          ANTHROPIC_API_KEY: test-anthropic-key
          RESEND_API_KEY: test-resend-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          STRAVA_CLIENT_ID: '12345'
          STRAVA_CLIENT_SECRET: test-client-secret
          STRAVA_WEBHOOK_VERIFY_TOKEN: test-verify-token
          ANTHROPIC_API_KEY: test-anthropic-key
          RESEND_API_KEY: test-resend-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
